<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; -webkit-font-smoothing: antialiased; background: #F6F6F0; }
    a { color: #CC5436; }
    a:hover { color: #B5482E; }
  </style>
</helmet>

<div style="font-family:'Plus Jakarta Sans',sans-serif;display:flex;min-height:100vh;background:#F6F6F0;">

  <div style="width:220px;flex-shrink:0;background:#FFFFFF;border-right:1px solid #E7E1DC;padding:24px 16px;display:flex;flex-direction:column;">
    <a href="Dashboard.dc.html" style="font-weight:800;font-size:19px;color:#241E18;text-decoration:none;padding:0 10px;margin-bottom:32px;display:block;">Moji</a>
    <a href="Dashboard.dc.html" style="{{ navBeranda }}" style-hover="background:#F6F6F0;">Beranda</a>
    <a href="Daftar-Modul.dc.html" style="{{ navModul }}" style-hover="background:#F6F6F0;">Modul</a>
    <a href="Profil.dc.html" style="{{ navProfil }}" style-hover="background:#F6F6F0;">Profil</a>
    <div style="flex:1;"></div>
    <a href="Profil.dc.html" style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;text-decoration:none;" style-hover="background:#F6F6F0;">
      <div style="width:32px;height:32px;border-radius:999px;background:#CC5436;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">D</div>
      <div>
        <div style="font-size:13px;font-weight:700;color:#241E18;">Dewi</div>
        <div style="font-size:11px;color:#9C948C;">7 hari beruntun</div>
      </div>
    </a>
  </div>

  <div style="flex:1;padding:40px 48px;max-width:900px;">
    <div style="{{ headerStyle }};margin-bottom:28px;">
      <h1 style="font-size:24px;font-weight:800;color:#241E18;margin:0 0 6px;">Semua Modul</h1>
      <p style="font-size:14px;color:#6B645D;margin:0;">Pilih modul untuk mulai belajar. Selesaikan satu untuk membuka berikutnya.</p>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;">
      <sc-for list="{{ modules }}" as="m" hint-placeholder-count="6">
        <a href="{{ m.href }}" style="{{ m.style }}">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
            <div style="width:44px;height:44px;border-radius:12px;background:{{ m.iconBg }};display:flex;align-items:center;justify-content:center;font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:19px;color:{{ m.iconFg }};">{{ m.icon }}</div>
            <div style="{{ m.tagStyle }}">{{ m.tag }}</div>
          </div>
          <div style="font-size:15.5px;font-weight:800;color:#241E18;margin-bottom:6px;">{{ m.name }}</div>
          <div style="font-size:12.5px;color:#9C948C;margin-bottom:14px;line-height:1.5;">{{ m.desc }}</div>
          <sc-if value="{{ m.locked }}">
            <div style="font-size:12px;color:#B3ABA1;font-weight:700;">🔒 Selesaikan modul sebelumnya</div>
          </sc-if>
          <sc-if value="{{ m.unlocked }}">
            <div style="display:flex;align-items:center;gap:8px;">
              <div style="flex:1;height:6px;border-radius:999px;background:#EDE7E1;overflow:hidden;"><div style="width:{{ m.pct }}%;height:100%;background:#CC5436;border-radius:999px;"></div></div>
              <div style="font-size:11.5px;color:#9C948C;font-weight:600;">{{ m.pctLabel }}</div>
            </div>
          </sc-if>
        </a>
      </sc-for>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { entered: false };
  D = { entrance: 300, stagger: 60 };
  E = { out: 'cubic-bezier(.16,1,.3,1)' };

  componentDidMount() {
    requestAnimationFrame(() => requestAnimationFrame(() => this.setState({ entered: true })));
  }
  ent(i, dist = 12) {
    const on = this.state.entered;
    return {
      opacity: on ? 1 : 0, transform: `translateY(${on ? 0 : dist}px)`,
      transition: `opacity ${this.D.entrance}ms ${this.E.out} ${i * this.D.stagger}ms, transform ${this.D.entrance}ms ${this.E.out} ${i * this.D.stagger}ms`,
    };
  }
  navStyle(active) {
    return { display: 'block', padding: '10px 12px', borderRadius: 10, marginBottom: 4, textDecoration: 'none', fontWeight: 700, fontSize: 14, color: active ? '#CC5436' : '#6B645D', background: active ? '#FBEAE4' : 'transparent' };
  }
  card(locked, i) {
    const base = {
      ...this.ent(i, 10), display: 'block', background: '#fff', border: '1px solid #E7E1DC', borderRadius: 18, padding: 20,
      textDecoration: 'none', opacity: locked ? this.ent(i, 10).opacity * 0.6 : this.ent(i, 10).opacity, cursor: locked ? 'default' : 'pointer',
    };
    return base;
  }

  renderVals() {
    const raw = [
      { key: 'hd', icon: 'あ', iconBg: '#FBEAE4', iconFg: '#CC5436', name: 'Hiragana Dasar', desc: 'あ–お dan 5 huruf pertama hiragana.', locked: false, pct: 62, href: 'Pelajaran%20Hiragana.dc.html' },
      { key: 'hl', icon: 'あ', iconBg: '#F6F6F0', iconFg: '#9C948C', name: 'Hiragana Lanjutan', desc: 'か sampai ん, melengkapi seluruh hiragana.', locked: true, href: '#' },
      { key: 'kd', icon: 'ア', iconBg: '#F6F6F0', iconFg: '#9C948C', name: 'Katakana Dasar', desc: 'Huruf untuk kata serapan & nama asing.', locked: true, href: '#' },
      { key: 'ks', icon: '語', iconBg: '#F6F6F0', iconFg: '#9C948C', name: 'Kosakata Sehari-hari', desc: 'Kata dan frasa dasar untuk percakapan.', locked: true, href: '#' },
      { key: 'pd', icon: 'は', iconBg: '#F6F6F0', iconFg: '#9C948C', name: 'Partikel Dasar', desc: 'は, が, を, に — fondasi tata bahasa.', locked: true, href: '#' },
      { key: 'kp', icon: '木', iconBg: '#F6F6F0', iconFg: '#9C948C', name: 'Kanji Pertama', desc: '20 kanji paling sering dipakai.', locked: true, href: '#' },
    ];
    const modules = raw.map((m, i) => ({
      ...m, unlocked: !m.locked, pctLabel: m.pct ? `${m.pct}%` : '',
      tag: 'Pemula', tagStyle: { fontSize: 10.5, fontWeight: 700, color: '#9C948C', background: '#F6F6F0', padding: '4px 8px', borderRadius: 999 },
      style: this.card(m.locked, i),
    }));
    return {
      headerStyle: this.ent(0, 8),
      navBeranda: this.navStyle(false), navModul: this.navStyle(true), navProfil: this.navStyle(false),
      modules,
    };
  }
}

</script>
</body>
</html>
