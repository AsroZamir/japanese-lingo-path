<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; -webkit-font-smoothing: antialiased; background: #F6F6F0; }
    a { color: #CC5436; }
    a:hover { color: #B5482E; }
  </style>
</helmet>

<div style="font-family:'Plus Jakarta Sans',sans-serif;display:flex;min-height:100vh;background:#F6F6F0;">

  <div style="width:220px;flex-shrink:0;background:#FFFFFF;border-right:1px solid #E7E1DC;padding:24px 16px;display:flex;flex-direction:column;">
    <a href="Dashboard.dc.html" style="font-weight:800;font-size:19px;color:#241E18;text-decoration:none;padding:0 10px;margin-bottom:32px;display:block;">Moji</a>
    <a href="Dashboard.dc.html" style="{{ navBeranda }}" style-hover="background:#F6F6F0;">Beranda</a>
    <a href="Daftar-Modul.dc.html" style="{{ navModul }}" style-hover="background:#F6F6F0;">Modul</a>
    <a href="Profil.dc.html" style="{{ navProfil }}" style-hover="background:#F6F6F0;">Profil</a>
    <div style="flex:1;"></div>
    <a href="Profil.dc.html" style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;text-decoration:none;" style-hover="background:#F6F6F0;">
      <div style="width:32px;height:32px;border-radius:999px;background:#CC5436;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">D</div>
      <div>
        <div style="font-size:13px;font-weight:700;color:#241E18;">Dewi</div>
        <div style="font-size:11px;color:#9C948C;">7 hari beruntun</div>
      </div>
    </a>
  </div>

  <div style="flex:1;padding:40px 48px;max-width:760px;">
    <div style="{{ headerStyle }};display:flex;align-items:center;gap:20px;margin-bottom:32px;">
      <div style="width:72px;height:72px;border-radius:999px;background:#CC5436;color:#fff;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">D</div>
      <div>
        <div style="font-size:20px;font-weight:800;color:#241E18;">Dewi Anggraini</div>
        <div style="font-size:13px;color:#9C948C;">Bergabung Agustus 2026</div>
      </div>
    </div>

    <div style="{{ statsStyle }};display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:32px;">
      <div style="background:#fff;border:1px solid #E7E1DC;border-radius:16px;padding:18px;text-align:center;">
        <div style="font-size:20px;font-weight:800;color:#241E18;">7</div>
        <div style="font-size:11.5px;color:#9C948C;margin-top:4px;">Hari beruntun</div>
      </div>
      <div style="background:#fff;border:1px solid #E7E1DC;border-radius:16px;padding:18px;text-align:center;">
        <div style="font-size:20px;font-weight:800;color:#241E18;">240</div>
        <div style="font-size:11.5px;color:#9C948C;margin-top:4px;">Total XP</div>
      </div>
      <div style="background:#fff;border:1px solid #E7E1DC;border-radius:16px;padding:18px;text-align:center;">
        <div style="font-size:20px;font-weight:800;color:#241E18;">5</div>
        <div style="font-size:11.5px;color:#9C948C;margin-top:4px;">Huruf dikuasai</div>
      </div>
    </div>

    <div style="{{ achStyle }}">
      <div style="font-size:15px;font-weight:800;color:#241E18;margin-bottom:14px;">Pencapaian</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;">
        <sc-for list="{{ badges }}" as="b" hint-placeholder-count="6">
          <div style="background:#fff;border:1px solid #E7E1DC;border-radius:14px;padding:16px;text-align:center;opacity:{{ b.opacity }};">
            <div style="width:40px;height:40px;border-radius:999px;background:{{ b.bg }};color:{{ b.fg }};font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;">{{ b.icon }}</div>
            <div style="font-size:12px;font-weight:700;color:#241E18;">{{ b.label }}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { entered: false };
  D = { entrance: 300, stagger: 70 };
  E = { out: 'cubic-bezier(.16,1,.3,1)' };

  componentDidMount() {
    requestAnimationFrame(() => requestAnimationFrame(() => this.setState({ entered: true })));
  }
  ent(i, dist = 12) {
    const on = this.state.entered;
    return {
      opacity: on ? 1 : 0, transform: `translateY(${on ? 0 : dist}px)`,
      transition: `opacity ${this.D.entrance}ms ${this.E.out} ${i * this.D.stagger}ms, transform ${this.D.entrance}ms ${this.E.out} ${i * this.D.stagger}ms`,
    };
  }
  navStyle(active) {
    return { display: 'block', padding: '10px 12px', borderRadius: 10, marginBottom: 4, textDecoration: 'none', fontWeight: 700, fontSize: 14, color: active ? '#CC5436' : '#6B645D', background: active ? '#FBEAE4' : 'transparent' };
  }

  renderVals() {
    const badges = [
      { icon: '✓', bg: '#DCF3E1', fg: '#368A48', label: 'Huruf Pertama', earned: true },
      { icon: '3', bg: '#FBEAE4', fg: '#CC5436', label: 'Streak 3 Hari', earned: true },
      { icon: '7', bg: '#FBEAE4', fg: '#CC5436', label: 'Streak 7 Hari', earned: true },
      { icon: '★', bg: '#E7ECF6', fg: '#5472AE', label: 'Kuis Sempurna', earned: true },
      { icon: '30', bg: '#F6F6F0', fg: '#C7C0B8', label: 'Streak 30 Hari', earned: false },
      { icon: 'あ', bg: '#F6F6F0', fg: '#C7C0B8', label: 'Semua Hiragana', earned: false },
    ].map(b => ({ ...b, opacity: b.earned ? 1 : 0.55 }));
    return {
      navBeranda: this.navStyle(false), navModul: this.navStyle(false), navProfil: this.navStyle(true),
      headerStyle: this.ent(0, 8), statsStyle: this.ent(1), achStyle: this.ent(2),
      badges,
    };
  }
}

</script>
</body>
</html>
